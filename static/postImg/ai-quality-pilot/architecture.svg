<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Quality Pilot deterministic-first architecture</title>
  <desc id="desc">Repositories, issue trackers, and an environment profile enter through Hermes, then pass through a deterministic QA engine, evidence truth model, and write gate before any issue, wiki, or pull request output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263a8b"/>
      <stop offset="1" stop-color="#176b83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#13203a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#54708f"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="53" text-anchor="middle" fill="#17233a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">AI Quality Pilot｜Deterministic-first QA Architecture</text>
  <text x="600" y="82" text-anchor="middle" fill="#627086" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">AI 協作推理，deterministic engine 掌握驗證與寫入權</text>

  <!-- Input cards -->
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <rect x="70" y="118" width="300" height="92" rx="18" fill="#ffffff" stroke="#d9e2ef"/>
    <circle cx="112" cy="164" r="23" fill="#eef2ff"/>
    <path d="M99 153h26v22H99zM104 148h16v5h-16z" fill="none" stroke="#4f5fd2" stroke-width="3" stroke-linejoin="round"/>
    <text x="150" y="158" fill="#1d2940" font-size="19" font-weight="750">Target Repository</text>
    <text x="150" y="184" fill="#69768a" font-size="14">code・tests・runtime・rules</text>

    <rect x="450" y="118" width="300" height="92" rx="18" fill="#ffffff" stroke="#d9e2ef"/>
    <circle cx="492" cy="164" r="23" fill="#fff0ec"/>
    <path d="M480 153h24v18h-14l-7 6v-6h-3z" fill="none" stroke="#d95745" stroke-width="3" stroke-linejoin="round"/>
    <text x="530" y="158" fill="#1d2940" font-size="19" font-weight="750">Redmine / Gitea</text>
    <text x="530" y="184" fill="#69768a" font-size="14">issues・PR・Wiki・live state</text>

    <rect x="830" y="118" width="300" height="92" rx="18" fill="#ffffff" stroke="#d9e2ef"/>
    <circle cx="872" cy="164" r="23" fill="#e8faf5"/>
    <path d="M862 163l7 7 14-17" fill="none" stroke="#118a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="158" fill="#1d2940" font-size="19" font-weight="750">Environment Profile</text>
    <text x="910" y="184" fill="#69768a" font-size="14">fixtures・target・side-effect boundary</text>
  </g>

  <path d="M220 211v40M600 211v40M980 211v40" fill="none" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Hermes layer -->
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <rect x="160" y="260" width="880" height="78" rx="20" fill="#ffffff" stroke="#b9c8dd" stroke-width="2"/>
    <rect x="181" y="279" width="186" height="40" rx="20" fill="#6b5bdd"/>
    <text x="274" y="305" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="750">Hermes Chat</text>
    <text x="402" y="293" fill="#1e2a42" font-size="19" font-weight="750">/quality-pilot dynamic skill</text>
    <text x="402" y="317" fill="#647187" font-size="14">對話入口、少量釐清與 MCP handoff；不繞過 engine contract</text>
  </g>

  <path d="M600 339v36" fill="none" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Deterministic core -->
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <rect x="80" y="384" width="1040" height="210" rx="26" fill="url(#core)"/>
    <text x="600" y="422" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">Deterministic QA Engine｜驗證、狀態與決策核心</text>

    <rect x="110" y="448" width="220" height="112" rx="16" fill="#ffffff" opacity="0.96"/>
    <text x="220" y="479" text-anchor="middle" fill="#253657" font-size="17" font-weight="800">Task Graph</text>
    <text x="220" y="505" text-anchor="middle" fill="#5b687c" font-size="14">DAG・parallel workers</text>
    <text x="220" y="529" text-anchor="middle" fill="#5b687c" font-size="14">verifier・checkpoint・repair</text>

    <rect x="365" y="448" width="220" height="112" rx="16" fill="#ffffff" opacity="0.96"/>
    <text x="475" y="479" text-anchor="middle" fill="#253657" font-size="17" font-weight="800">Case &amp; Runner</text>
    <text x="475" y="505" text-anchor="middle" fill="#5b687c" font-size="14">contract・preflight・oracle</text>
    <text x="475" y="529" text-anchor="middle" fill="#5b687c" font-size="14">execution・normalization</text>

    <rect x="620" y="448" width="220" height="112" rx="16" fill="#ffffff" opacity="0.96"/>
    <text x="730" y="479" text-anchor="middle" fill="#253657" font-size="17" font-weight="800">Evidence &amp; Truth</text>
    <text x="730" y="505" text-anchor="middle" fill="#5b687c" font-size="14">workflow・test・gate・health</text>
    <text x="730" y="529" text-anchor="middle" fill="#5b687c" font-size="14">hash・report・audit</text>

    <rect x="875" y="448" width="215" height="112" rx="16" fill="#ffffff" opacity="0.96"/>
    <text x="982" y="479" text-anchor="middle" fill="#253657" font-size="17" font-weight="800">Knowledge Graph</text>
    <text x="982" y="505" text-anchor="middle" fill="#5b687c" font-size="14">SQLite・JSON・ontology</text>
    <text x="982" y="529" text-anchor="middle" fill="#5b687c" font-size="14">provenance read model</text>
  </g>

  <path d="M600 595v31" fill="none" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Write gate and outputs -->
  <g font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <rect x="390" y="635" width="420" height="52" rx="26" fill="#17233a"/>
    <path d="M425 652h23v18h-23zM430 652v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#6ee7c7" stroke-width="3"/>
    <text x="617" y="669" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">Deterministic Write Gate + Human Approval</text>
  </g>

  <path d="M470 688v25H225M600 688v25M730 688v25H975" fill="none" stroke="#54708f" stroke-width="3"/>
  <path d="M225 713v15M600 713v15M975 713v15" fill="none" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif" font-size="15" font-weight="750">
    <rect x="95" y="724" width="260" height="30" rx="15" fill="#fff0ec" stroke="#f2c8bd"/>
    <text x="225" y="745" text-anchor="middle" fill="#a84234">Gitea / Redmine issues</text>
    <rect x="470" y="724" width="260" height="30" rx="15" fill="#eef2ff" stroke="#cdd5f7"/>
    <text x="600" y="745" text-anchor="middle" fill="#4855b8">Wiki / evidence reports</text>
    <rect x="845" y="724" width="260" height="30" rx="15" fill="#e8faf5" stroke="#bce9dc"/>
    <text x="975" y="745" text-anchor="middle" fill="#117560">Advisory review / PR handoff</text>
  </g>
</svg>
