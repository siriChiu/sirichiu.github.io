<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">AI Quality Pilot four-axis truth model</title>
  <desc id="desc">Four independent cards separate workflow status, test outcome, gate status, and health status, preventing one passing command from being treated as full product readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#f1fbf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17233a" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1200" height="590" rx="30" fill="url(#bg)"/>
  <text x="600" y="57" text-anchor="middle" fill="#17233a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Four-axis Truth Model｜四軸真實狀態</text>
  <text x="600" y="88" text-anchor="middle" fill="#617087" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif" font-size="16">單一命令 PASS ≠ 工作流完成 ≠ 允許寫入 ≠ 系統健康</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <rect x="80" y="130" width="490" height="170" rx="22" fill="#ffffff" stroke="#ced7fa" stroke-width="2"/>
    <rect x="80" y="130" width="12" height="170" rx="6" fill="#5967d8"/>
    <circle cx="142" cy="187" r="30" fill="#eef0ff"/>
    <path d="M128 187h28M142 173v28" stroke="#5967d8" stroke-width="5" stroke-linecap="round"/>
    <text x="190" y="177" fill="#263455" font-size="23" font-weight="800">workflow_status</text>
    <text x="190" y="205" fill="#59677c" font-size="16">流程目前走到哪裡？</text>
    <text x="119" y="250" fill="#657287" font-size="15">RUNNING・BLOCKED・HOLD・COMPLETED</text>
    <text x="119" y="276" fill="#657287" font-size="14">Lifecycle progress, not a product verdict.</text>

    <rect x="630" y="130" width="490" height="170" rx="22" fill="#ffffff" stroke="#bfe7db" stroke-width="2"/>
    <rect x="630" y="130" width="12" height="170" rx="6" fill="#159477"/>
    <circle cx="692" cy="187" r="30" fill="#e8faf5"/>
    <path d="M678 188l10 10 19-23" fill="none" stroke="#159477" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="177" fill="#263455" font-size="23" font-weight="800">test_outcome</text>
    <text x="740" y="205" fill="#59677c" font-size="16">執行的 assertions 觀察到什麼？</text>
    <text x="669" y="250" fill="#657287" font-size="15">PASS・FAIL・BLOCK・HOLD・NOT_RUN</text>
    <text x="669" y="276" fill="#657287" font-size="14">Partial probes stay HOLD; they cannot manufacture PASS.</text>

    <rect x="80" y="340" width="490" height="170" rx="22" fill="#ffffff" stroke="#f1d2b3" stroke-width="2"/>
    <rect x="80" y="340" width="12" height="170" rx="6" fill="#d77b25"/>
    <circle cx="142" cy="397" r="30" fill="#fff5e8"/>
    <path d="M130 395h24v19h-24zM135 395v-8a7 7 0 0 1 14 0v8" fill="none" stroke="#d77b25" stroke-width="4"/>
    <text x="190" y="387" fill="#263455" font-size="23" font-weight="800">gate_status</text>
    <text x="190" y="415" fill="#59677c" font-size="16">下一個副作用或發布可以進行嗎？</text>
    <text x="119" y="460" fill="#657287" font-size="15">ALLOWED・DENIED・NEEDS_APPROVAL</text>
    <text x="119" y="486" fill="#657287" font-size="14">Evidence, freshness, policy, and human approval apply.</text>

    <rect x="630" y="340" width="490" height="170" rx="22" fill="#ffffff" stroke="#cbd9e9" stroke-width="2"/>
    <rect x="630" y="340" width="12" height="170" rx="6" fill="#3c779f"/>
    <circle cx="692" cy="397" r="30" fill="#eaf4fb"/>
    <path d="M674 402h8l6-15 9 24 7-14h9" fill="none" stroke="#3c779f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740" y="387" fill="#263455" font-size="23" font-weight="800">health_status</text>
    <text x="740" y="415" fill="#59677c" font-size="16">元件或整合健康是否被獨立檢查？</text>
    <text x="669" y="460" fill="#657287" font-size="15">HEALTHY・DEGRADED・NOT_EVALUATED</text>
    <text x="669" y="486" fill="#657287" font-size="14">QA result never substitutes for an independent health check.</text>
  </g>

  <rect x="286" y="536" width="628" height="38" rx="19" fill="#17233a"/>
  <text x="600" y="561" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif" font-size="17" font-weight="750">Truth stays separated until deterministic policy explicitly combines it.</text>
</svg>
