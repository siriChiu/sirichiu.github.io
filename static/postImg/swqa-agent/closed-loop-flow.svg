<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Self-growing SWQA agent closed-loop heartbeat flow</title>
  <desc id="desc">A workflow diagram showing feedforward guides, live issue sync, heartbeat test execution, triage, publishing, retrospective, and test-case growth.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 32px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #526070; }
      .band-title { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #526070; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .node-title { font: 700 16px Arial, sans-serif; fill: #111827; }
      .node-text { font: 400 12px Arial, sans-serif; fill: #526070; }
      .card { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.2; filter: url(#shadow); }
      .soft-blue { fill: #eaf2ff; stroke: #93c5fd; }
      .soft-green { fill: #e8f8ef; stroke: #86efac; }
      .soft-orange { fill: #fff3df; stroke: #fdba74; }
      .soft-red { fill: #feecec; stroke: #fca5a5; }
      .soft-purple { fill: #f1ecff; stroke: #c4b5fd; }
      .soft-slate { fill: #eef2f7; stroke: #cbd5e1; }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-green); }
      .red-line { fill: none; stroke: #dc2626; stroke-width: 3; marker-end: url(#arrow-red); }
      .thin-line { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <text class="title" x="600" y="52" text-anchor="middle">Self-Growing SWQA Agent</text>
  <text class="subtitle" x="600" y="80" text-anchor="middle">Hermes Agent + Heartbeat Scheduler + Harness Engineering</text>

  <rect class="card soft-blue" x="70" y="116" width="260" height="108" rx="18"/>
  <text class="band-title" x="200" y="145" text-anchor="middle">Feedforward Guides</text>
  <text class="small" x="200" y="171" text-anchor="middle">README / TEST_ITEMS</text>
  <text class="small" x="200" y="193" text-anchor="middle">TEST_CASE README</text>
  <text class="small" x="200" y="215" text-anchor="middle">runner registry / test plan</text>

  <rect class="card soft-purple" x="470" y="116" width="260" height="108" rx="18"/>
  <text class="band-title" x="600" y="145" text-anchor="middle">Live Collaboration State</text>
  <text class="small" x="600" y="171" text-anchor="middle">Gitea issues / comments</text>
  <text class="small" x="600" y="193" text-anchor="middle">open, closed, updated_at</text>
  <text class="small" x="600" y="215" text-anchor="middle">wiki status page</text>

  <rect class="card soft-green" x="870" y="116" width="260" height="108" rx="18"/>
  <text class="band-title" x="1000" y="145" text-anchor="middle">Evidence &amp; Outputs</text>
  <text class="small" x="1000" y="171" text-anchor="middle">stdout / logs / artifacts</text>
  <text class="small" x="1000" y="193" text-anchor="middle">issue mirrors / status table</text>
  <text class="small" x="1000" y="215" text-anchor="middle">heartbeat run summary</text>

  <path class="blue-line" d="M330 170 C385 170 410 170 460 170"/>
  <path class="blue-line" d="M730 170 C785 170 810 170 860 170"/>

  <rect class="card" x="70" y="280" width="150" height="94" rx="16"/>
  <text class="node-title" x="145" y="311" text-anchor="middle">Syncing</text>
  <text class="node-text" x="145" y="335" text-anchor="middle">mirror issues</text>
  <text class="node-text" x="145" y="355" text-anchor="middle">refresh tracking</text>

  <rect class="card" x="250" y="280" width="150" height="94" rx="16"/>
  <text class="node-title" x="325" y="311" text-anchor="middle">Selecting</text>
  <text class="node-text" x="325" y="335" text-anchor="middle">TEST_ITEMS</text>
  <text class="node-text" x="325" y="355" text-anchor="middle">registry lookup</text>

  <rect class="card" x="430" y="280" width="150" height="94" rx="16"/>
  <text class="node-title" x="505" y="311" text-anchor="middle">Executing</text>
  <text class="node-text" x="505" y="335" text-anchor="middle">positive / negative</text>
  <text class="node-text" x="505" y="355" text-anchor="middle">boundary / exception</text>

  <rect class="card" x="610" y="280" width="150" height="94" rx="16"/>
  <text class="node-title" x="685" y="311" text-anchor="middle">Triaging</text>
  <text class="node-text" x="685" y="335" text-anchor="middle">PASS evidence</text>
  <text class="node-text" x="685" y="355" text-anchor="middle">FAIL diagnosis</text>

  <rect class="card" x="790" y="280" width="150" height="94" rx="16"/>
  <text class="node-title" x="865" y="311" text-anchor="middle">Publishing</text>
  <text class="node-text" x="865" y="335" text-anchor="middle">status table</text>
  <text class="node-text" x="865" y="355" text-anchor="middle">wiki sync</text>

  <rect class="card" x="970" y="280" width="150" height="94" rx="16"/>
  <text class="node-title" x="1045" y="311" text-anchor="middle">Retrospect</text>
  <text class="node-text" x="1045" y="335" text-anchor="middle">six hats</text>
  <text class="node-text" x="1045" y="355" text-anchor="middle">grow cases</text>

  <path class="blue-line" d="M220 327 L240 327"/>
  <path class="blue-line" d="M400 327 L420 327"/>
  <path class="blue-line" d="M580 327 L600 327"/>
  <path class="blue-line" d="M760 327 L780 327"/>
  <path class="blue-line" d="M940 327 L960 327"/>

  <path class="green-line" d="M1045 374 C1045 470 200 470 200 384"/>
  <text class="small" x="600" y="458" text-anchor="middle">no_change / update_existing_tc / add_new_tc</text>

  <rect class="card soft-orange" x="80" y="530" width="240" height="116" rx="18"/>
  <text class="band-title" x="200" y="560" text-anchor="middle">Pre-flight Gate</text>
  <text class="small" x="200" y="586" text-anchor="middle">files, branch baseline</text>
  <text class="small" x="200" y="608" text-anchor="middle">connectivity, writable state</text>
  <text class="small" x="200" y="630" text-anchor="middle">evidence directory ready</text>

  <rect class="card soft-slate" x="360" y="530" width="220" height="116" rx="18"/>
  <text class="band-title" x="470" y="560" text-anchor="middle">Revision Gate</text>
  <text class="small" x="470" y="586" text-anchor="middle">insufficient evidence</text>
  <text class="small" x="470" y="608" text-anchor="middle">retry triage up to 3</text>
  <text class="small" x="470" y="630" text-anchor="middle">before filing</text>

  <rect class="card soft-red" x="620" y="530" width="220" height="116" rx="18"/>
  <text class="band-title" x="730" y="560" text-anchor="middle">Escalation Gate</text>
  <text class="small" x="730" y="586" text-anchor="middle">unclear write boundary</text>
  <text class="small" x="730" y="608" text-anchor="middle">new failure mode</text>
  <text class="small" x="730" y="630" text-anchor="middle">human decision needed</text>

  <rect class="card soft-red" x="880" y="530" width="240" height="116" rx="18"/>
  <text class="band-title" x="1000" y="560" text-anchor="middle">Abort Gate</text>
  <text class="small" x="1000" y="586" text-anchor="middle">critical dependency failure</text>
  <text class="small" x="1000" y="608" text-anchor="middle">irreversible risk</text>
  <text class="small" x="1000" y="630" text-anchor="middle">preserve evidence</text>

  <path class="thin-line" d="M200 530 C210 470 165 425 145 382"/>
  <path class="thin-line" d="M470 530 C475 470 505 425 505 382"/>
  <path class="thin-line" d="M730 530 C724 470 690 425 685 382"/>
  <path class="red-line" d="M1000 530 C990 460 910 418 865 382"/>

  <text class="tiny" x="600" y="705" text-anchor="middle">PASS keeps local evidence. FAIL updates issue, local status, wiki, and may expand the test suite.</text>
</svg>
