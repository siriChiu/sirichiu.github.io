<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Quality Pilot close-loop lifecycle</title>
  <desc id="desc">The lifecycle moves from observe to normalize, execute, triage, publish, evolve, and prune, with evidence and write gates preserving traceability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172955"/>
      <stop offset="0.56" stop-color="#254b86"/>
      <stop offset="1" stop-color="#15766f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#07101f" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#bce9df"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="150" fill="#ffffff" opacity="0.035"/>
  <circle cx="100" cy="565" r="180" fill="#ffffff" opacity="0.035"/>
  <text x="600" y="58" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Evidence-driven Close Loop｜可追蹤的品質閉環</text>
  <text x="600" y="89" text-anchor="middle" fill="#d8e5f6" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif" font-size="16">每一步都產生可驗證 artifact；remote write 必須通過 gate</text>

  <!-- flow arrows -->
  <g fill="none" stroke="#bce9df" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M286 190h54"/>
    <path d="M573 190h54"/>
    <path d="M860 190h54"/>
    <path d="M1013 255v78"/>
    <path d="M914 405h-54"/>
    <path d="M627 405h-54"/>
    <path d="M340 405h-54"/>
    <path d="M187 333V277"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <!-- top row -->
    <rect x="88" y="125" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="124" cy="163" r="20" fill="#eaf0ff"/>
    <text x="124" y="170" text-anchor="middle" fill="#4e60cf" font-size="20" font-weight="800">1</text>
    <text x="154" y="168" fill="#233250" font-size="21" font-weight="800">Observe</text>
    <text x="110" y="207" fill="#647087" font-size="14">repo・issue・PR・run</text>
    <text x="110" y="231" fill="#647087" font-size="14">environment signals</text>

    <rect x="375" y="125" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="411" cy="163" r="20" fill="#e8f7ff"/>
    <text x="411" y="170" text-anchor="middle" fill="#27749f" font-size="20" font-weight="800">2</text>
    <text x="441" y="168" fill="#233250" font-size="21" font-weight="800">Normalize</text>
    <text x="397" y="207" fill="#647087" font-size="14">canonical mapping</text>
    <text x="397" y="231" fill="#647087" font-size="14">contracts・dedupe・scope</text>

    <rect x="662" y="125" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="698" cy="163" r="20" fill="#e9faf6"/>
    <text x="698" y="170" text-anchor="middle" fill="#17846e" font-size="20" font-weight="800">3</text>
    <text x="728" y="168" fill="#233250" font-size="21" font-weight="800">Execute</text>
    <text x="684" y="207" fill="#647087" font-size="14">preflight・runner</text>
    <text x="684" y="231" fill="#647087" font-size="14">assertions・evidence</text>

    <rect x="949" y="125" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="985" cy="163" r="20" fill="#fff5e9"/>
    <text x="985" y="170" text-anchor="middle" fill="#c97325" font-size="20" font-weight="800">4</text>
    <text x="1015" y="168" fill="#233250" font-size="21" font-weight="800">Triage</text>
    <text x="971" y="207" fill="#647087" font-size="14">PASS / FAIL / BLOCK</text>
    <text x="971" y="231" fill="#647087" font-size="14">truth axes・risk review</text>

    <!-- bottom row, right to left -->
    <rect x="949" y="340" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="985" cy="378" r="20" fill="#fff0ec"/>
    <text x="985" y="385" text-anchor="middle" fill="#cf5946" font-size="20" font-weight="800">5</text>
    <text x="1015" y="383" fill="#233250" font-size="21" font-weight="800">Publish</text>
    <text x="971" y="422" fill="#647087" font-size="14">write gate・human gate</text>
    <text x="971" y="446" fill="#647087" font-size="14">issue・Wiki・PR handoff</text>

    <rect x="662" y="340" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="698" cy="378" r="20" fill="#f2edff"/>
    <text x="698" y="385" text-anchor="middle" fill="#7255c7" font-size="20" font-weight="800">6</text>
    <text x="728" y="383" fill="#233250" font-size="21" font-weight="800">Evolve</text>
    <text x="684" y="422" fill="#647087" font-size="14">growing cases</text>
    <text x="684" y="446" fill="#647087" font-size="14">targeted repair・retest</text>

    <rect x="375" y="340" width="198" height="130" rx="22" fill="#ffffff"/>
    <circle cx="411" cy="378" r="20" fill="#edf5f8"/>
    <text x="411" y="385" text-anchor="middle" fill="#4e7184" font-size="20" font-weight="800">7</text>
    <text x="441" y="383" fill="#233250" font-size="21" font-weight="800">Prune</text>
    <text x="397" y="422" fill="#647087" font-size="14">closed-item removal</text>
    <text x="397" y="446" fill="#647087" font-size="14">stale state・duplicates</text>

    <rect x="88" y="340" width="198" height="130" rx="22" fill="#10233f" stroke="#70d8c1" stroke-width="2"/>
    <circle cx="124" cy="378" r="20" fill="#1d4d5b"/>
    <path d="M113 378l8 8 15-18" fill="none" stroke="#70e0c6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="383" fill="#ffffff" font-size="21" font-weight="800">Next Tick</text>
    <text x="110" y="422" fill="#c9deea" font-size="14">new code・issue・signal</text>
    <text x="110" y="446" fill="#c9deea" font-size="14">or explicit idle</text>
  </g>

  <path d="M250 535h700" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
  <g font-family="Inter, Segoe UI, Microsoft JhengHei, Arial, sans-serif">
    <rect x="300" y="518" width="600" height="62" rx="31" fill="#ffffff" opacity="0.10" stroke="#ffffff" stroke-opacity="0.24"/>
    <text x="600" y="544" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="750">Traceable artifacts at every transition</text>
    <text x="600" y="566" text-anchor="middle" fill="#cfe4ed" font-size="14">contract hash・evidence・checkpoint・ledger・report</text>
  </g>
</svg>
